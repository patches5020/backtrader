[project]
name = "cdcx-cli"
version = "0.1.0"
description = "CDCX AI trade analysis engine -- EMA/ATR, RSI, Fibonacci, FVG, Volume Profile, and Market Structure combined into a single weighted trade signal."
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
cdcx = "cdcx.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cdcx*"]
