[project]
name = "cdcx-cli"
version = "0.1.0"
description = "CDCX AI trade analysis engine -- EMA/ATR, RSI, Fibonacci, FVG, Volume Profile, and Market Structure combined into a single weighted trade signal."
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
# `cdcx.backtrader_strategy` / `cdcx.backtrader_runner` / `--backtrader` on
# the CLI bridge the CDCX signal engine into this repo's own backtrader
# Cerebro engine instead of the standalone paper backtester in
# `cdcx.backtest`. Install this repo's `backtrader` package to use them.
backtrader = ["backtrader"]

[project.scripts]
cdcx-ai = "cdcx.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cdcx*"]
